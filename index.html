{id:2,name:'Karim Hasan',phone:'01700000002',address:'College Road, Savar, Dhaka',pkg:'Standard 20 Mbps',price:800,service:'Active',payment:'Unpaid',expiry:'2026-09-05',due:800},
{id:3,name:'Jamal Ahmed',phone:'01700000003',address:'Station Road, Tongi, Gazipur',pkg:'Premium 30 Mbps',price:1200,service:'Active',payment:'Expired',expiry:'2026-08-30',due:1200},
{id:4,name:'Sohag Islam',phone:'01700000004',address:'Uttara Sector 10, Dhaka',pkg:'Basic 10 Mbps',price:500,service:'Active',payment:'Paid',expiry:'2026-10-02',due:0},
{id:5,name:'Rafi Ahmed',phone:'01700000005',address:'Board Bazar, Gazipur',pkg:'Premium 30 Mbps',price:1200,service:'Active',payment:'Expired',expiry:'2026-08-25',due:1200},
{id:6,name:'Nayeem Khan',phone:'01700000006',address:'Kashimpur, Gazipur',pkg:'Standard 20 Mbps',price:800,service:'Active',payment:'Unpaid',expiry:'2026-09-07',due:800}
],payments:[]};
let db=JSON.parse(localStorage.getItem('star_v11')||localStorage.getItem('star_v10')||localStorage.getItem('star_v9')||localStorage.getItem('star_v7')||'null')||seed, page='dashboard';
const app=document.getElementById('app'), modal=document.getElementById('modal'), box=document.getElementById('modalbox');
const oldHamb=document.getElementById('hamb');
if(oldHamb){oldHamb.onclick=function(e){e.preventDefault();document.getElementById('side').classList.toggle('open');};}
db.customers.forEach(c=>{
 if(!c.service)c.service='Active';
 if(!c.createdAt)c.createdAt='2026-09-01';
 if(!c.previousDue)c.previousDue=0;
});
if(!Array.isArray(db.incomes))db.incomes=[];
if(!Array.isArray(db.expenses))db.expenses=[];
function save(){localStorage.setItem('star_v11',JSON.stringify(db));localStorage.setItem('star_v10',JSON.stringify(db));}
function money(x){return '৳ '+Number(x||0).toLocaleString()}
function badge(x){return `<span class="badge ${x.toLowerCase()}">${x}</span>`}
function nav(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===page))}

document.getElementById('hamb').onclick=()=>document.getElementById('side').classList.toggle('open');
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>go(x.dataset.p));
document.getElementById('globalSearch').oninput=e=>{page='customers';nav();customers(e.target.value)}
function monthKey(d){return String(d||'').slice(0,7)}
function dashboard(){
 let c=db.customers;
 let counts={Paid:c.filter(x=>x.payment==='Paid').length,Unpaid:c.filter(x=>x.payment==='Unpaid').length,Expired:c.filter(x=>x.payment==='Expired').length,Active:c.filter(x=>x.service!=='Inactive').length,Inactive:c.filter(x=>x.service==='Inactive').length};
 let collection=db.payments.reduce((a,x)=>a+Number(x.amount||0),0);
 let due=c.reduce((a,x)=>a+Number(x.due||0)+Number(x.previousDue||0),0);
 let income=db.incomes.reduce((a,x)=>a+Number(x.amount||0),0);
 let expense=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 let monthlyNew=c.filter(x=>monthKey(x.createdAt)===monthKey(new Date().toISOString())).length;
 app.innerHTML=`<div class="head"><div><span class="kicker">● LIVE ADMIN SYSTEM • V17</span><h1 style="margin-top:10px">STAR COMMUNICATION • PREMIUM ADMIN</h1><p>Live ISP control center • Billing • Collection • Due • New connections • Income • Expense • Profit</p>
    <div class="premium-actions">

      <button class="btn green" onclick="go('collection')">৳ Receive Bill</button>
      <button class="btn orange" onclick="go('due')">📌 Due Control</button>
      <button class="btn gray" onclick="go('backup')">🗄 Backup</button>
    </div></div><button class="btn" onclick="addCustomer()">+ New Connection</button></div>
 <div style="margin:14px 0;padding:16px;border-radius:14px;background:#102b52;color:#fff;box-shadow:0 10px 24px #102b5222">
<b style="font-size:18px">🚀 STAR COMMUNICATION V17 — Working Dashboard</b><br>
<span style="opacity:.9">এই Version সরাসরি <b>index.html</b> খুললেই চলবে। Backend API/Database integration-এর জন্য project structure পরে connect করা হবে। MikroTik ও OLT এখনো connect করা হয়নি।</span>
</div><div class="stats">
 <div class="stat blue" onclick="go('customers')">Total Clients<b>${c.length}</b><small>View all clients →</small></div>
 <div class="stat greenbg" onclick="go('paid')">Paid Clients<b>${counts.Paid}</b><small>View paid clients →</small></div>
 <div class="stat orangebg" onclick="go('unpaid')">Unpaid Clients<b>${counts.Unpaid}</b><small>Receive payment →</small></div>
 <div class="stat redbg" onclick="go('expired')">Expired Clients<b>${counts.Expired}</b><small>Renew connection →</small></div>
 <div class="stat greenbg" onclick="go('collection')">Total Bill Collection<b>${money(collection)}</b><small>View collection →</small></div>
 <div class="stat redbg" onclick="go('due')">Previous / Total Due<b>${money(due)}</b><small>View due list →</small></div>
 <div class="stat blue" onclick="go('newconnections')">Monthly New Connection<b>${monthlyNew}</b><small>View this month →</small></div>
 <div class="stat purplebg" onclick="go('income')">Income<b>${money(income)}</b><small>Add / view income →</small></div>

 <div class="stat redbg" onclick="go('inactive')">Inactive / OFF<b>${counts.Inactive}</b><small>View suspended clients →</small></div>
 </div>
<div class="health">
  <div class="mini"><small>System Status</small><b>● ONLINE</b><span>Local live database enabled</span></div>
  <div class="mini"><small>Today's Date</small><b id="todayText">${new Date().toLocaleDateString()}</b><span>Expiry and payment tracking</span></div>
  <div class="mini"><small>Quick Control</small><b>ON / OFF</b><span>Manual client service control</span></div>
  <div class="mini"><small>Database</small><b>${c.length} Clients</b><span>Auto-saved in this browser</span></div>
</div>`} 
function rows(list){return `<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Address</th><th>Package</th><th>Bill Status</th><th>Connection</th><th>Expiry Date</th><th>Due</th><th>Action</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.phone}</td><td>${x.address}</td><td>${x.pkg}</td><td>${badge(x.payment)}</td><td><span class="badge ${x.service==='Inactive'?'expired':'paid'}">${x.service==='Inactive'?'OFF / Inactive':'ON / Active'}</span></td><td>${x.expiry}</td><td>${money(x.due)}</td><td><button class="btn gray" onclick="details(${x.id})">Details</button> <button class="btn" onclick="editCustomer(${x.id})">Edit</button> ${x.service==='Inactive'?`<button class="btn green" onclick="toggleService(${x.id})">▶ Activate</button>`:`<button class="btn red" onclick="toggleService(${x.id})">⏸ Inactive</button>`} ${x.payment==='Paid'?`<button class="btn orange" onclick="paymentForm(${x.id})">Renew</button>`:`<button class="btn green" onclick="paymentForm(${x.id})">Receive Payment</button>`}</td></tr>`).join('')||'<tr><td colspan="9">No customer found</td></tr>'}</tbody></table></div>`}
function statusPage(status){let list=db.customers.filter(x=>x.payment===status), due=list.reduce((a,x)=>a+x.due,0);
app.innerHTML=`<div class="head"><div><button class="btn gray" onclick="go('dashboard')">← Dashboard</button><h1 style="margin-top:15px">${status} Clients</h1><p>Separate detailed customer and billing page</p></div></div>

<div class="card"><div class="filters"><input placeholder="Search name, phone or address..." oninput="searchStatus('${status}',this.value)"></div><div id="list">${rows(list)}</div></div>`}

<div><b>Connection Status</b><p><b>${x.service==='Inactive'?'⏸ INACTIVE / OFF':'● ACTIVE / ON'}</b></p></div><div><b>Expiry Date</b><p>${x.expiry}</p></div><div><b>Due Amount</b><p>${money(x.due)}</p></div></div></div><div class="actions"><button class="btn ${x.service==='Inactive'?'green':'red'}" onclick="toggleService(${x.id});closeModal()">${x.service==='Inactive'?'▶ Activate Client':'⏸ Keep Client Inactive / OFF'}</button><button class="btn green" onclick="closeModal();paymentForm(${x.id})">💰 Receive Payment / Renew</button></div>`;modal.classList.add('show')}

function paymentForm(id){let x=db.customers.find(x=>x.id===id);let today=new Date().toISOString().slice(0,10);box.innerHTML=`<div class="modalhead"><h2>💳 Receive Payment</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice"><b>${x.name}</b> • ${x.phone}<br>${x.address}</div>
<div class="formgrid">
<div class="field"><label>Customer Name</label><input value="${x.name}" disabled></div><div class="field"><label>Package</label><input value="${x.pkg}" disabled></div>

<div class="field"><label>Payment Date *</label><input id="payDate" type="date" value="${today}"></div>
<div class="field"><label>New Expiry Date *</label><input id="newExpiry" type="date" value="${new Date(Date.now()+30*86400000).toISOString().slice(0,10)}" required></div>
<div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank</option></select></div>
<div class="field full"><label>Full Address</label><textarea id="address">${x.address}</textarea></div>
<div class="field full"><label>Note</label><textarea id="note" placeholder="Optional payment note"></textarea></div>
</div><div class="actions"><button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn green" onclick="confirmPayment(${id})">✓ Confirm Payment</button></div>`;modal.classList.add('show')}
async function confirmPayment(id){let x=db.customers.find(x=>x.id===id), amount=Number(document.getElementById('paidAmount').value), expiry=document.getElementById('newExpiry').value;
if(!amount||amount<=0){alert('Please enter paid amount');return} if(!expiry){alert('Please select new expiry date');return} if(!TOKEN){alert('Database login required');return}
try{await api('/customers/'+id+'/payment',{method:'POST',body:JSON.stringify({amount,payment_date:document.getElementById('payDate').value,new_expiry_date:expiry,method:document.getElementById('method').value,note:document.getElementById('note').value})});await syncFromBackend();closeModal();alert('Payment saved permanently in server database.');go('customers')}catch(e){alert('Payment failed: '+e.message)}}
function inactivePage(){

<script>
let API=localStorage.getItem('star_api_base')||'http://localhost:5000/api';
let TOKEN=localStorage.getItem('star_api_token')||'';
async function api(path,opt={}){
 opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};
 if(TOKEN)opt.headers.Authorization='Bearer '+TOKEN;
 const r=await fetch(API+path,opt);
 if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||'API error')}
 return r.json();
}
async function apiLogin(){
 API=document.getElementById('apiBase').value.replace(/\/$/,'');
 document.getElementById('loginMsg').textContent='Connecting...';
 try{
  const d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})}).then(async r=>{if(!r.ok)throw new Error('Login failed');return r.json()});
  TOKEN=d.token;localStorage.setItem('star_api_base',API);localStorage.setItem('star_api_token',TOKEN);
  document.getElementById('apiLogin').style.display='none';document.getElementById('apiStatus').textContent='BACKEND: ONLINE';
  await syncFromBackend();
 }catch(e){document.getElementById('loginMsg').textContent='Error: '+e.message}
}
async function syncFromBackend(){
 try{
  const [cs,ps,inc,exp]=await Promise.all([api('/customers'),api('/payments'),api('/income'),api('/expenses')]);
  db.customers=cs.map(x=>({id:x.id,name:x.name,phone:x.phone,address:x.address||'',pkg:'Package',price:x.monthly_bill||0,payment:x.payment_status,service:x.service_status,expiry:x.expiry_date||'Not set',due:x.due||0,previousDue:x.previous_due||0,createdAt:(x.created_at||'').slice(0,10)}));
  db.payments=ps.map(x=>({id:x.id,customerId:x.customer_id,name:x.name,phone:x.phone,address:x.address||'',amount:x.amount,date:x.payment_date,method:x.method,expiry:x.new_expiry_date||''}));
  db.incomes=inc.map(x=>({id:x.id,source:x.source,amount:x.amount,date:x.income_date,note:x.note||''}));
  db.expenses=exp.map(x=>({id:x.id,category:x.category,amount:x.amount,date:x.expense_date,note:x.note||''}));
  save();render();
 }catch(e){document.getElementById('apiStatus').textContent='BACKEND: OFFLINE'}
}
window.addEventListener('load',async()=>{
 if(TOKEN){document.getElementById('apiLogin').style.display='none';document.getElementById('apiStatus').textContent='BACKEND: ONLINE';await syncFromBackend();}
 else {document.getElementById('apiBase').value=API;}
});
</script>

    host:document.getElementById(p+'Host').value,
    port:Number(document.getElementById(p+'Port').value||443),
    username:document.getElementById(p+'User').value,
    password:document.getElementById(p+'Pass').value
  };
  try{
    var r=await fetch('/api/network/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json().catch(()=>({}));
    msg.textContent=r.ok?'✅ Saved successfully':'❌ '+(j.error||'Save failed');
  }catch(e){msg.textContent='❌ Backend connection failed';}
}
</script>
